name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      # The fast suite must pass without ever touching the network. It is the
      # gate that proves TraceRAG degrades correctly when the model is absent.
      - name: Run offline test suite
        run: pytest -q -m "not slow"

      - name: Run model-dependent tests
        run: pytest -q -m slow
        continue-on-error: true

  smoke:
    name: HTTP smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Load the sample corpus
        run: python -m scripts.load_corpus

      - name: Start the server
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then
              echo "server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start"; cat server.log; exit 1

      - name: Smoke test
        run: python -m scripts.smoke_test --base-url http://127.0.0.1:8000

      - name: Regenerate the benchmark
        run: python -m app.evaluate --split test --calibrate

      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports/

      - name: Server log on failure
        if: failure()
        run: cat server.log

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # BAKE_MODEL=false keeps CI fast; the model is downloaded at run time
      # instead of being embedded in the image.
      - name: Build the image
        run: docker build --build-arg BAKE_MODEL=false -t tracerag:ci .

      - name: Start the container
        run: |
          docker run -d --name tracerag -p 8000:8000 tracerag:ci
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then
              echo "container healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container failed to become healthy"; docker logs tracerag; exit 1

      - name: Smoke the container
        run: |
          curl -fsS http://127.0.0.1:8000/api/status
          docker logs tracerag

      - name: Tear down
        if: always()
        run: docker rm -f tracerag || true
